<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" fill="#1a1a2e" rx="40"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="96" cy="96" r="80" fill="url(#grad1)" opacity="0.2" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Laptop/Code icon -->
  <g transform="translate(96, 96)">
    <!-- Screen -->
    <rect x="-45" y="-35" width="90" height="60" rx="4" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Stand -->
    <rect x="-25" y="25" width="50" height="6" rx="2" fill="url(#grad1)"/>
    
    <!-- Code brackets { } -->
    <text x="-30" y="0" font-size="32" fill="url(#grad1)" font-family="monospace" font-weight="bold" text-anchor="middle">{</text>
    <text x="30" y="0" font-size="32" fill="url(#grad1)" font-family="monospace" font-weight="bold" text-anchor="middle">}</text>
    
    <!-- Dot accent -->
    <circle cx="0" cy="15" r="3" fill="url(#grad1)"/>
  </g>
  
  <!-- Border glow -->
  <rect width="192" height="192" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.5" rx="40"/>
</svg>
